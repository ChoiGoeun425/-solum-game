<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>김솔음 키우기</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- ==================================================
         시작 화면
    =================================================== -->

    <div id="startScreen">

        <div class="start-content">

            <h1>김솔음 키우기</h1>

            <button id="startButton">
                START
            </button>

        </div>

    </div>

    <!-- ==================================================
         게임 화면
    =================================================== -->

    <main class="game">


        <!-- ==================================================
             게임 제목
        =================================================== -->

        <header class="game-header">

            <h1>
                김솔음 키우기
            </h1>

        </header>



        <!-- ==================================================
             캐릭터 + 오늘의 할 일
        =================================================== -->

        <section class="top-area">



            <!-- 캐릭터 -->

            <div class="character-area">

                <img id="characterImage" src="images/character0.png" alt="캐릭터">

            </div>


            <!-- 오른쪽 영역 -->

            <div class="right-area">


                <!-- 오늘의 할 일 -->

                <div class="todo-box">

                    <h1>
                        오늘의 할 일
                    </h1>


                    <!-- 1. 양치하기 -->

                    <div class="todo" id="todo0">

                        <span class="check">
                            □
                        </span>

                        <span>
                            양치하기
                        </span>

                    </div>



                    <!-- 2. 머리 빗기 -->

                    <div class="todo" id="todo1">

                        <span class="check">
                            □
                        </span>

                        <span>
                            머리 빗기
                        </span>

                    </div>



                    <!-- 3. 옷 입기 -->

                    <div class="todo" id="todo2">

                        <span class="check">
                            □
                        </span>

                        <span>
                            옷 입기
                        </span>

                    </div>



                    <!-- 4. 브라운 챙기기 -->

                    <div class="todo" id="todo3">

                        <span class="check">
                            □
                        </span>

                        <span>
                            브라운 챙기기
                        </span>

                    </div>

                </div>



                <!-- ==================================================
                     출근하기
                =================================================== -->

                <button id="workButton" disabled onclick="goToWork()">
                    출근하기
                </button>



                <!-- ==================================================
                     게임 초기화
                =================================================== -->

                <button id="resetButton" onclick="resetGame()">
                    게임 초기화
                </button>

                <!-- ★ 대화창 -->

                <div class="dialogue-box">

                    <p id="dialogueText">
                        출근 준비를 도와주셨으면 합니다.
                    </p>

                </div>


            </div>

        </section>


        <!-- ==================================================
             행동 버튼
        =================================================== -->

        <section class="action-area">


            <!-- 양치하기 -->

            <button class="action-button" id="action0" onclick="selectAction(0)">

                <img src="images/toothbrush.png" alt="양치하기">

            </button>



            <!-- 머리 빗기 -->

            <button class="action-button locked" id="action1" onclick="selectAction(1)" disabled>

                <img src="images/comb.png" alt="머리 빗기">

            </button>



            <!-- 옷 입기 -->

            <button class="action-button locked" id="action2" onclick="selectAction(2)" disabled>

                <img src="images/shirt.png" alt="옷 입기">

            </button>



            <!-- 브라운 챙기기 -->

            <button class="action-button locked" id="action3" onclick="selectAction(3)" disabled>

                <img src="images/brown.png" alt="브라운 챙기기">

            </button>


        </section>


    </main>



    <!-- ==================================================
         비밀번호 팝업
    =================================================== -->

    <div id="passwordModal" class="modal hidden">

        <div class="password-box">


            <h2>
                비밀번호를<br>
                입력해 주세요
            </h2>



            <input type="text" id="passwordInput" placeholder="비밀번호" autocomplete="off" lang="ko" inputmode="text">



            <p id="passwordError" class="password-error">
                비밀번호가 올바르지 않습니다.
            </p>



            <div class="password-buttons">


                <button class="confirm-button" onclick="confirmPassword()">
                    확인
                </button>



                <button class="cancel-button" onclick="closePasswordModal()">
                    취소
                </button>


            </div>


        </div>

    </div>



    <script src="script.js"></script>


</body>

</html>
